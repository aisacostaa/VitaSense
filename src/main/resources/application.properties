spring.datasource.url=jdbc:sqlite:vitasense.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# SQLite aceita uma escrita por vez: uma única conexão evita "database is locked" com as rotinas agendadas
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080
# detalhes de erro NÃO são expostos ao usuário
server.error.include-message=never
server.error.include-exception=false
# false = não cria o usuário/casa de demonstração (admin@vitasense.com)
vitasense.seed=true
# envio de fotos (limite validado também no serviço: 2 MB)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
