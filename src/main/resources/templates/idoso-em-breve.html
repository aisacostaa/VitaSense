<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#235354">
  <title>VitaSense • Em breve</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" th:href="@{/css/vitasense.css}">
  <link rel="stylesheet" th:href="@{/css/idoso.css}">
  <link rel="stylesheet" th:href="@{/css/idoso-extra.css}">
</head>
<body class="id-page app">
<div class="id-shell">
  <aside th:replace="~{fragments/idoso :: menu(${ativa})}"></aside>
  <div class="id-conteudo">
    <header th:replace="~{fragments/idoso :: topo}"></header>
    <main class="id-principal">
      <h1 th:text="${titulo}">Seção</h1>
      <p class="id-sub">Esta parte estará disponível em breve.</p>
      <a class="id-btn-creme id-voltar-inicio" th:href="@{/idoso}">Voltar ao início</a>
    </main>
  </div>
</div>
<script th:src="@{/js/idoso.js}"></script>
</body>
</html>
