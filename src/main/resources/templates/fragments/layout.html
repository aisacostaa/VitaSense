
<header th:fragment="topo(ativo)" class="vs-header">

    <div class="topo">

        <a class="topo-cfg"
           th:href="@{/configuracoes}"
           title="Configurações"
           aria-label="Configurações">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/>
                <path d="m19.4 13.5 1.1.9-1.2 2.1-1.4-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.5h-2.4l-.3-1.5a7.8 7.8 0 0 1-1.6-.9l-1.4.5-1.2-2.1 1.1-.9a7.2 7.2 0 0 1 0-1.8l-1.1-.9 1.2-2.1 1.4.5a7.8 7.8 0 0 1 1.6-.9l.3-1.5h2.4l.2 1.5a7.8 7.8 0 0 1 1.5.9l1.4-.5 1.2 2.1-1.1.9a7.2 7.2 0 0 1 0 1.8Z"/>
            </svg>

        </a>

        <a class="topo-marca"
           th:href="@{/dashboard}"
           aria-label="VitaSense - início">

            <img th:src="@{/img/logo.png}"
                 alt=""
                 class="topo-logo"
                 onerror="this.style.display='none'">

            <span>
                <b>VitaSense</b>
                <small>Painel do responsável</small>
            </span>

        </a>

        <div class="topo-user">

            <a th:href="@{/alertas}"
               class="notif"
               aria-label="Notificações">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>
                </svg>

                <span class="notif-label">Notificações</span>

                <span class="notif-count"
                      th:text="${alertasPendentes ?: 0}">0</span>

            </a>

            <span class="sep" aria-hidden="true"></span>

            <div class="avatar" th:text="${iniciais}">VS</div>

            <div class="user-txt">
                <b th:text="${usuarioNome}">Usuário</b>
                <small th:text="${usuarioPerfil}">Responsável</small>
            </div>

            <form th:action="@{/logout}" method="post">

                <button class="sair"
                        type="submit"
                        title="Sair"
                        aria-label="Sair">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/>
                    </svg>

                </button>

            </form>

        </div>

    </div>

    <!-- MENU PRINCIPAL -->

    <nav class="menu" aria-label="Navegação principal">

        <a th:href="@{/dashboard}"
           th:classappend="${ativo == 'dashboard'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
            </svg>

            <span>Dashboard</span>

        </a>

        <a th:href="@{/saude}"
           th:classappend="${ativo == 'saude'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"/>
                <path d="M3.5 12h4l2-3.2 3.1 6.3 2-3.1h5.9"/>
            </svg>

            <span>Saúde</span>

        </a>

        <a th:href="@{/cameras}"
           th:classappend="${ativo == 'cameras'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="13" height="12" rx="2"/>
                <path d="m16 10 5-3v10l-5-3"/>
            </svg>

            <span>Câmeras</span>

        </a>

        <a th:href="@{/casa}"
           th:classappend="${ativo == 'casa'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1Z"/>
            </svg>

            <span>Minha casa</span>

        </a>

        <a th:href="@{/alertas}"
           th:classappend="${ativo == 'alertas'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 2.8 19a1.3 1.3 0 0 0 1.1 2h16.2a1.3 1.3 0 0 0 1.1-2L12 3Z"/>
                <path d="M12 9v5m0 3h.01"/>
            </svg>

            <span>Alertas</span>

            <span class="menu-count"
                  th:if="${alertasPendentes != null and alertasPendentes > 0}"
                  th:text="${alertasPendentes}">0</span>

        </a>

        <a th:href="@{/lembretes}"
           th:classappend="${ativo == 'lembretes'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>
            </svg>

            <span>Lembretes</span>

        </a>

        <a th:href="@{/automacoes}"
           th:classappend="${ativo == 'automacoes'} ? 'on' : ''">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/>
                <circle cx="12" cy="12" r="4"/>
            </svg>

            <span>Automações</span>

        </a>

    </nav>
